# Nginx site config for Una Collaborative Editor
#
# Protects the app with HTTP Basic Auth and proxies Hocuspocus WebSocket traffic.
#
# Replace these placeholders before enabling:
# - archival.example.org (server_name)
# - /ABSOLUTE/PATH/TO/editor/apps/web/dist (built web assets)
# - /etc/nginx/.htpasswd_archival_editor (htpasswd file path)

server {
    listen 80;
    listen [::]:80;
    server_name archival.example.org;

    # Lightweight gate while full auth is pending.
    auth_basic "Restricted";
    auth_basic_user_file /etc/nginx/.htpasswd_archival_editor;

    root /ABSOLUTE/PATH/TO/editor/apps/web/dist;
    index index.html;

    # SPA routing for Vite/React.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hocuspocus (Y.js) websocket endpoint.
    # Frontend should use: wss://archival.example.org/collab/
    location /collab/ {
        proxy_pass http://127.0.0.1:1234/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}
